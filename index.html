<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="star-favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Systems</title>
    <style>
        :root {
            --accent-color: #f1e7a9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000000;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #333333;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 2px 2px;
            min-height: 40px;
        }

        .top-bar a.logo-btn img {
            display: block;
            max-height: 40px;
            width: auto;
        }

        .top-bar a.nav-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 5px 10px;
        }

        .top-bar a.nav-link:hover {
            text-decoration: underline;
        }

        .separator-fade {
            width: 2px;
            height: 28px;
            background: linear-gradient(
                to bottom,
                transparent,
                var(--accent-color) 40%,
                var(--accent-color) 60%,
                transparent
            );
            opacity: 0.8;
        }

        footer {
            margin-top: auto;
            background-color: #121212;
            border-top: 1px solid #222222;
            padding: 30px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }
        
        .footer-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--accent-color);
            text-decoration: none;
            opacity: 0.8;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .footer-contact {
            color: var(--accent-color);
            opacity: 0.8;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .hero h1 {
            color: var(--accent-color);
            font-size: 42px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 30px;
            }
        }
        
        .hero-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background-color: var(--accent-color);
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 9999px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        
        .hero-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .suggestion-section {
            max-width: 600px;
            margin: 40px auto 80px;
            padding: 30px;
            background-color: #121212;
            border: 1px solid var(--accent-color);
            border-radius: 12px;
        }
        
        .suggestion-section h2 {
            color: var(--accent-color);
            font-size: 22px;
            margin-bottom: 10px;
        }
        
        .suggestion-section p {
            color: var(--accent-color);
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .suggestion-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        
        .form-group label {
            color: var(--accent-color);
            font-size: 14px;
            font-weight: bold;
        }
        
        .form-group input[type="email"],
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #000000;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            color: var(--accent-color);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        
        .form-group input[type="email"]:focus,
        .form-group textarea:focus {
            box-shadow: 0 0 5px var(--accent-color);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .submit-btn {
            align-self: flex-start;
            padding: 10px 24px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="https://starsystems.tech" class="logo-btn">
            <img src="starnobg.png" alt="Star Systems Logo">
        </a>
        
        <div class="separator-fade"></div>
        
        <a href="mcus/" class="nav-link">MCU's</a>
        
        <div class="separator-fade"></div>
        
        <a href="https://dev.to/runaway" class="nav-link">Blog</a>
        
        <div class="separator-fade"></div>
    </header>
    <main>
    <section class="hero">
        <h1>Presoldered MCU kits. No extras, no leftovers, just enough.</h1>
        <a href="mcus/" class="hero-btn">Our microcontrollers</a>
    </section>
    <section class="suggestion-section">
    <h2>Suggest a Future MCU Kit</h2>
    <p>As you can see we only have 1 item, any kits you want? Let us know!</p>

    <form class="suggestion-form" action="https://formspree.io/f/mnpnzzgq" method="POST" autocomplete="off">
        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="suggestion">Your Suggestion</label>
            <textarea id="suggestion" name="suggestion" placeholder="Tell us which MCU kit or accessories you want..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Suggestion</button>
    </form>
    </section>
    </main>
    <footer>
        <div class="footer-links">
            <a href="#" target="_blank">GitHub</a>
            <a href="https://dev.to/runaway" target="_blank">Dev.to</a>
            <a href="#" target="_blank">TikTok</a>
            <a href="#" target="_blank">Etsy</a>
        </div>
        <div class="footer-contact">
            Contact: <span>runawaystars@proton.me</span>
        </div>
    </footer>

</body>
</html>
